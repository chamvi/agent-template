# Never commit this Secret unencrypted. Use SOPS or External Secrets.
# Intentionally excluded from kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
    name: agent-template-env
    namespace: agents
type: Opaque
stringData:
    CHAMVI_TOKENS: '[{"value":"change-me-at-least-16-characters","id":"owner","permissions":["*"]}]'
    ANTHROPIC_API_KEY: change-me
    DATABASE_URL: postgresql://change-me
